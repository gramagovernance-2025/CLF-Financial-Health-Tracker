<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLF Financial Health Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.0/plotly.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#2F9C74; --primary-soft:#E3F3EC; --gold:#CE9C3C; --gold-soft:#FAF0DC;
  --low:#C55F49; --low-soft:#FBEAE6; --ink:#1E2320; --ink-soft:#5B6660;
  --panel:#FFFFFF; --panel-alt:#F5F7F5; --grey:#B7BEB7; --grey-soft:#EFF1EE; --line:#E2E6E2; --line-strong:#D3D9D3;
  --bg:#F7F9F7;
}
/* White stroke halo behind choropleth map labels (district/block names
   drawn as a scattergeo text trace) - Plotly only sets fill/font-size
   inline on these <text> elements, never stroke/paint-order, so this
   rule layers a legibility halo without fighting Plotly's own styling.
   Needed because the map's bucket fills are medium-toned (green/
   yellow/red/grey), and no single flat text color read well against
   all of them without this.
   Scoped to g.scatterlayer specifically (the label trace's own layer),
   NOT a bare "#explore-map text" - that broader selector was ALSO
   matching Plotly's own hover-tooltip text (g.hoverlayer text.nums),
   giving the tooltip the same thick halo meant for small map labels
   and making it look bold/chunky instead of its normal thin text.
   Confirmed via the DOM: label text lives under g.trace.scattergeo /
   g.scatterlayer, tooltip text lives under an entirely separate
   g.hovertext / g.hoverlayer branch - this selector only reaches the
   former.
   pointer-events:none here is the hover-detachment fix - the label
   trace's own `hoverinfo:'skip'` (set in drawChoroplethForKey) was
   NOT enough on its own; confirmed directly that hovering near a
   label still let Plotly's hover system treat the text trace as a
   competing target, detaching the tooltip from the cursor instead of
   anchoring it to the choropleth fill underneath. This makes the
   label layer fully transparent to the mouse, so every hover always
   resolves to the choropleth trace below it - restores the original
   pre-label hover behavior. */
#explore-map g.scatterlayer text{
  pointer-events: none;
  paint-order: stroke fill;
  stroke: #ffffff;
  /* em, not px - scales with each label's own font-size (which varies
     a lot: 5-11px depending on district/block polygon area). A fixed
     px stroke looked fine at the larger district sizes but became a
     bulky white "chip" rather than a thin outline at the smaller
     block-level sizes - this keeps the halo visually proportional at
     every size. */
  stroke-width: 0.18em;
  stroke-linejoin: round;
}
*{box-sizing:border-box;}
body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
.serif{ font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif; }
.container{ max-width:1200px; margin:0 auto; padding:20px 16px 60px; }
header.top{ padding:22px 0 16px; }
h1{ font-size:clamp(22px,4vw,30px); margin:0 0 4px; font-weight:600; }
.hint{ font-size:12.5px; color:var(--ink-soft); }
.navbar{ display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; background:var(--panel); border:1px solid var(--line-strong); border-radius:12px; padding:16px; margin-top:16px; }
.navfield{ display:flex; flex-direction:column; gap:6px; min-width:200px; flex:1; }
.navfield.quarterfield{ min-width:170px; flex:0 0 auto; }
.navfield label{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); }
.navfield select{ font-family:inherit; font-size:14px; padding:10px 12px; border-radius:8px; border:1px solid var(--line-strong); background:#fff; min-height:42px; }
.navfield select#sel-quarter{ font-weight:700; color:var(--primary); border-color:var(--primary); }
.crumbs{ font-size:13.5px; color:var(--ink-soft); margin-top:14px; }
.crumbs b{ color:var(--ink); font-weight:600; }
.tab-switcher{ display:flex; gap:4px; background:var(--panel-alt); border:1px solid var(--line-strong); border-radius:10px; padding:4px; width:fit-content; margin-top:20px; }
.tab-btn{ font-family:inherit; font-size:14px; font-weight:600; padding:8px 18px; border:none; border-radius:7px; background:transparent; color:var(--ink-soft); cursor:pointer; transition:background .15s,color .15s; }
.tab-btn.active{ background:var(--primary); color:#fff; }
.tab-btn:not(.active):hover{ background:var(--line); }
.coverage-banner{ margin-top:10px; padding:10px 14px; background:var(--low-soft); border:1px solid var(--low); border-radius:8px; color:var(--low); font-size:13px; font-weight:600; line-height:1.5; width:100%; box-sizing:border-box; }
section{ margin-top:30px; }
.section-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
.section-head h2{ font-size:20px; font-weight:600; margin:0; }
.subsection-head{ font-size:14px; font-weight:700; margin:22px 0 12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
.subsection-head:first-child{ margin-top:0; }
.panel{ background:var(--panel); border:1px solid var(--line-strong); border-radius:12px; padding:18px; }
.ind-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px; align-items:stretch; }
.ind-card{ text-align:center; display:flex; flex-direction:column; align-items:center; height:100%; }
.ind-card .kpi-box, .ind-card .big-plain{ width:100%; }
.ind-card .ind-label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
.kpi-box{ border-radius:10px; padding:16px; text-align:center; border:1px solid var(--line); flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.kpi-box.green{ background:var(--primary-soft); border-color:var(--primary); }
.kpi-box.yellow{ background:var(--gold-soft); border-color:var(--gold); }
.kpi-box.red{ background:var(--low-soft); border-color:var(--low); }
.kpi-box .big{ font-size:26px; font-weight:700; }
.kpi-box .caption{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; }
.kpi-box .therm, .kpi-box .caption{ width:100%; }
.comparison-table{ width:100%; border-collapse:collapse; font-size:14px; }
.comparison-table th{ text-align:left; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); padding:8px 12px; border-bottom:2px solid var(--line-strong); white-space:nowrap; }
.comparison-table td{ padding:10px 12px; border-bottom:1px solid var(--line); }
.comparison-table tr:last-child td{ border-bottom:none; }
.comparison-table tr.cmp-overall-row td{ font-weight:700; border-top:2px solid var(--line-strong); }
.comparison-table td.cmp-val{ font-weight:600; border-radius:6px; }
.comparison-table td.cmp-val.green{ background:var(--primary-soft); color:var(--primary); }
.comparison-table td.cmp-val.yellow{ background:var(--gold-soft); color:#8a6417; }
.comparison-table td.cmp-val.red{ background:var(--low-soft); color:var(--low); }
.agree-flag{ font-size:12px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; }
.agree-flag.agree-close{ background:var(--primary-soft); color:var(--primary); }
.agree-flag.agree-moderate{ background:var(--gold-soft); color:#8a6417; }
.agree-flag.agree-large{ background:var(--low-soft); color:var(--low); }
.big-plain{ flex:1; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; }
.therm{ margin-top:10px; height:14px; border-radius:999px; background:var(--grey-soft); position:relative; overflow:visible; }
.therm .fill{ height:100%; border-radius:999px; }
.therm .fill.green{ background:var(--primary); } .therm .fill.yellow{ background:var(--gold); } .therm .fill.red{ background:var(--low); }
.therm .marker{ position:absolute; top:-4px; width:2px; height:22px; background:var(--ink); }
.month-strip{ display:flex; justify-content:space-between; gap:8px; width:100%; margin-top:12px; padding-top:10px; border-top:1px dashed var(--line-strong); }
.month-strip .m{ flex:1; text-align:center; }
.month-strip .m .mlabel{ font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; }
.month-strip .m .mval{ font-size:12.5px; font-weight:700; margin-top:2px; }
.refined-bar-wrap{ display:flex; flex-direction:column; align-items:center; gap:12px; }
.refined-bar{ display:flex; height:32px; width:100%; max-width:440px; }
.refined-bar .seg{ display:flex; align-items:center; justify-content:center; color:#fff; font-size:12.5px; font-weight:700; white-space:nowrap; position:relative; cursor:default; }
.refined-bar .seg[data-tip]:hover{ filter:brightness(1.08); }
.refined-bar .seg[data-tip]:hover::after{
  content:attr(data-tip); position:absolute; bottom:calc(100% + 9px); left:50%; transform:translateX(-50%);
  background:var(--ink); color:#fff; font-size:11.5px; font-weight:600; white-space:nowrap;
  padding:6px 10px; border-radius:6px; z-index:20; pointer-events:none; box-shadow:0 4px 10px rgba(0,0,0,.18);
}
.refined-bar .seg[data-tip]:hover::before{
  content:''; position:absolute; bottom:calc(100% + 3px); left:50%; transform:translateX(-50%);
  border:5px solid transparent; border-top-color:var(--ink); z-index:20; pointer-events:none;
}
.refined-bar-legend{ display:flex; gap:22px; font-size:14px; color:var(--ink); flex-wrap:wrap; justify-content:center; text-align:center; }
.refined-bar-legend b{ font-size:15px; }
.refined-bar-legend .dot{ display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:6px; }
.grade-good{ color:var(--primary); } .grade-mid{ color:var(--gold); } .grade-bad{ color:var(--low); }
table{ width:100%; border-collapse:collapse; font-size:13px; }
thead th{ text-align:left; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; padding:0 10px 10px; border-bottom:1px solid var(--line-strong); white-space:nowrap; cursor:pointer; user-select:none; }
thead th:hover{ color:var(--ink); }
thead th .arrow{ font-size:9px; margin-left:3px; opacity:.6; }
tbody td{ padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
tbody tr:hover{ background:var(--panel-alt); cursor:pointer; }
tbody tr.me{ background:var(--primary-soft); font-weight:700; }
.rank-cell{ font-family:"Iowan Old Style",Georgia,serif; font-size:16px; font-weight:700; color:var(--ink-soft); }
.table-wrap{ overflow-x:auto; }
.heatmap-select, .chart-select{ font-family:inherit; font-size:13px; padding:8px 10px; border-radius:8px; border:1px solid var(--line-strong); background:#fff; margin-bottom:14px; }
.weight-btn{ appearance:none; cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; color:var(--primary); background:var(--primary-soft); border:1px solid var(--line-strong); border-radius:999px; padding:8px 16px; }
.weight-modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(30,35,32,0.45); z-index:100; align-items:center; justify-content:center; padding:20px; }
.weight-modal-backdrop.open{ display:flex; }
.weight-modal{ background:var(--panel); border-radius:14px; max-width:520px; width:100%; max-height:88vh; overflow-y:auto; padding:26px 28px; }
.weight-modal-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
.weight-modal-head h3{ font-size:19px; font-weight:600; margin:0; }
.weight-modal-close{ appearance:none; border:none; background:none; cursor:pointer; font-size:22px; color:var(--ink-soft); }
.weight-modal-hint{ font-size:12.5px; color:var(--ink-soft); margin:2px 0 20px; }
.weight-row{ margin-bottom:16px; }
.weight-row-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.weight-row-head .wname{ font-size:13.5px; font-weight:600; }
.weight-row-head .wpct{ font-size:14px; font-weight:700; color:var(--primary); }
.weight-slider{ width:100%; accent-color:var(--primary); }
.weight-result{ margin-top:20px; padding:14px 16px; background:var(--panel-alt); border-radius:10px; border:1px solid var(--line); }
.weight-result-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.weight-result .wlabel{ font-size:12.5px; color:var(--ink-soft); }
.weight-result .wval{ font-size:18px; font-weight:700; color:var(--primary); }
.weight-modal-actions{ display:flex; justify-content:space-between; gap:10px; margin-top:20px; }
.weight-reset-btn{ appearance:none; cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-soft); background:var(--panel-alt); border:1px solid var(--line-strong); border-radius:999px; padding:8px 16px; }
.weight-done-btn{ appearance:none; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700; color:#fff; background:var(--primary); border:none; border-radius:999px; padding:8px 20px; }
.standing-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-top:14px; }
.standing-card{ background:var(--panel-alt); border:1px solid var(--line); border-radius:10px; padding:14px 16px; text-align:center; }
.standing-card .big{ font-size:30px; font-weight:700; color:var(--primary); }
.standing-card .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:700; margin-top:4px; }
.score-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
.score-row:last-child{ border-bottom:none; }
.score-row .sname{ font-size:14px; font-weight:600; }
.score-row .sval{ font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
.score-total{ display:flex; justify-content:space-between; align-items:center; padding:16px 0 6px; margin-top:6px; border-top:2px solid var(--ink); }
.score-total .sname{ font-size:16px; font-weight:700; }
.score-total .sval{ font-size:26px; font-weight:700; color:var(--primary); }
.disclaimer{ font-size:12.5px; color:var(--ink-soft); }
.data-gap-note{ background:var(--gold-soft); border:1px solid var(--gold); border-radius:10px; padding:12px 16px; font-size:13px; color:var(--ink); margin-bottom:14px; }
.data-gap-note+.data-gap-note{ margin-top:-6px; }
.paired-bar-row{ margin-bottom:10px; }
.paired-bar-row .plabel{ font-size:12px; color:var(--ink-soft); margin-bottom:4px; display:flex; justify-content:space-between; }
.paired-bar-track{ height:16px; border-radius:6px; background:var(--grey-soft); overflow:hidden; }
.paired-bar-fill{ height:100%; border-radius:6px; }
</style>
</head>
<body>
<div class="container">
  <header class="top">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;">
      <div>
        <h1 class="serif">CLF Financial Health Tracker</h1>
        <p class="hint">Operational Self-Sufficiency &middot; Loan Disbursement &middot; Loan Repayment (OTR / Upto) &middot; Balance Sheets</p>
      </div>
      <button id="btn-export-excel" class="weight-btn" style="white-space:nowrap;">&#128190; Export to Excel</button>
    </div>
    <div class="navbar">
      <div class="navfield"><label for="sel-district">District</label><select id="sel-district"><option value="">— All Bihar (State view) —</option></select></div>
      <div class="navfield"><label for="sel-block">Block</label><select id="sel-block" disabled><option value="">— Whole district —</option></select></div>
      <div class="navfield"><label for="sel-clf">CLF</label><select id="sel-clf" disabled><option value="">— Whole block —</option></select></div>
      <div class="navfield quarterfield"><label for="sel-quarter">Quarter</label><select id="sel-quarter"></select></div>
    </div>
    <div class="crumbs" id="crumbs"></div>
  </header>
  <div id="app"><p class="disclaimer">Loading…</p></div>
</div>

<script>
// ============================================================================
// Indicator metadata
// ============================================================================
const IND_BY_KEY = {
  oss:          {label:'OSS', unit:'pct', gaugeMax:150,
                 zones:[{to:75,color:'#C55F49'},{to:100,color:'#CE9C3C'},{to:150,color:'#2F9C74'}], desc:'Operational Self-Sufficiency (earned income / admin expense)'},
  otr:          {label:'On-Time Repayment Rate', unit:'pct', gaugeMax:100,
                 zones:[{to:75,color:'#C55F49'},{to:95,color:'#CE9C3C'},{to:100,color:'#2F9C74'}], desc:'Combined ICF+GL: amount recovered this quarter / amount due this quarter'},
  upto:         {label:'Upto Repayment Rate', unit:'pct', gaugeMax:150,
                 zones:[{to:60,color:'#C55F49'},{to:90,color:'#CE9C3C'},{to:150,color:'#2F9C74'}], desc:'Combined ICF+GL: cumulative recovery since inception / cumulative amount due'},
  disb_pct:     {label:'Loan Disbursement %', unit:'pct', gaugeMax:100,
                 zones:[{to:60,color:'#C55F49'},{to:90,color:'#CE9C3C'},{to:100,color:'#2F9C74'}], desc:'Cumulative loan disbursed / cumulative loan requested'},
  disb_amount:  {label:'Loan Disbursement Amount', unit:'rs', composite:false, desc:'Cumulative loan amount disbursed'},
  cash_balance: {label:'Cash Balance', unit:'rs', threshold:25000, monthly:true, desc:'Physical cash on hand — quarter-end value, flagged above Rs 25,000'},
  bank_balance: {label:'Bank Balance', unit:'rs', threshold:2500000, monthly:true, desc:'Bank balance — quarter-end value, flagged if all 3 months this quarter were above Rs 25 Lakh'},
  idle_funds:   {label:'Idle Funds', unit:'rs', monthly:true, desc:'Cash excess over Rs 25,000 (every month) + bank excess over Rs 25L (only in quarters flagged red), summed across the quarter'},
};
const COMPOSITE = Object.keys(IND_BY_KEY).filter(k=>IND_BY_KEY[k].composite!==false);
const BUCKET_2GROUP = new Set([]);
const BUCKET_INDS = ['oss','otr','upto','disb_pct','idle_funds','cash_balance','bank_balance'];
const BUCKET_COLOR = {green:'#2F9C74', yellow:'#CE9C3C', red:'#C55F49'};
const CATEGORY_THRESHOLD_TEXT = {
  oss:          {green:'≥100%', yellow:'75–100%', red:'<75%'},
  otr:          {green:'≥95%', yellow:'75–95%', red:'<75%'},
  upto:         {green:'≥90%', yellow:'60–90%', red:'<60%'},
  disb_pct:     {green:'≥90%', yellow:'60–90%', red:'<60%'},
  idle_funds:   {green:'₹0', yellow:'up to ₹5L', red:'>₹5L'},
  cash_balance: {green:'<₹20k', yellow:'₹20k–30k', red:'>₹30k'},
  bank_balance: {green:'0 of 3 months >₹25L', yellow:'1–2 of 3 months >₹25L', red:'all 3 months >₹25L'},
};
const MONTH_LABELS = {"2026-01":"Jan","2026-02":"Feb","2026-03":"Mar","2026-04":"Apr","2026-05":"May","2026-06":"Jun","2026-07":"Jul","2026-08":"Aug","2026-09":"Sep"};
const MONTH_LABELS_FULL = {"2026-01":"Jan'26","2026-02":"Feb'26","2026-03":"Mar'26","2026-04":"Apr'26","2026-05":"May'26","2026-06":"Jun'26","2026-07":"Jul'26","2026-08":"Aug'26","2026-09":"Sep'26"};

const SECTIONS = [
  {title:'Operational Self-Sufficiency', inds:['oss']},
  {title:'Loan Disbursement', inds:['disb_amount','disb_pct']},
  {title:'Loan Repayment', inds:['otr','upto']},
  {title:'Balance Sheets', inds:['cash_balance','bank_balance','idle_funds']},
];

function fmtNum(v){ if(v==null) return '—'; return Math.round(v).toLocaleString('en-IN'); }
function fmtPct(v){ if(v==null) return '—'; return v.toFixed(1)+'%'; }
function fmtRs(v){
  if(v==null) return '—';
  const a = Math.abs(v);
  if(a>=1e7) return '₹'+(v/1e7).toFixed(2)+' Cr';
  if(a>=1e5) return '₹'+(v/1e5).toFixed(2)+' L';
  return '₹'+Math.round(v).toLocaleString('en-IN');
}
function fmtRsShort(v){
  if(v==null) return '—';
  const a = Math.abs(v);
  if(a>=1e7) return '₹'+(v/1e7).toFixed(1)+'Cr';
  if(a>=1e5) return '₹'+(v/1e5).toFixed(1)+'L';
  if(a>=1e3) return '₹'+(v/1e3).toFixed(1)+'k';
  return '₹'+Math.round(v).toLocaleString('en-IN');
}
function fmtInd(ind, v){ return IND_BY_KEY[ind].unit==='pct' ? fmtPct(v) : fmtRs(v); }
function ord(n){ const s=["th","st","nd","rd"], v=n%100; return s[(v-20)%10]||s[v]||s[0]; }
function grade(pctl){ if(pctl==null) return ''; if(pctl>=66) return 'grade-good'; if(pctl>=33) return 'grade-mid'; return 'grade-bad'; }
function slugify(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

async function fetchJson(path){
  const res = await fetch(path);
  if(!res.ok) throw new Error('fetch failed: '+path);
  return res.json();
}

let MANIFEST=null, STATE_DATA=null, DISTRICT_DATA=null, BLOCK_DATA=null, CLF_DATA=null;
let SCOPE = 'state';
let SCORING_SUMMARY = null;
let CURRENT_QUARTER = null;
// Three-way tab split: 'audit' (default), 'lokos', or 'comparison'.
// Every fetched unit carries `by_period`/`series` (audit-sourced),
// `lokos_by_period`/`lokos_series` (LokOS-sourced), AND
// `compiled_by_period` (blended audit+LokOS percentiles/ranks, no raw
// values of its own - see build_tracker_data.py's COMPILED_*_BY_Q) -
// switching tabs doesn't refetch anything, just changes which one
// currentPeriod()/monthStripHtml() read from. The 'comparison' tab
// needs audit+lokos+compiled simultaneously (periodFor() below), not
// just one - currentPeriod() itself falls back to by_period for any
// tab other than 'lokos', which is fine for 'comparison' since the
// handful of non-table callers of currentPeriod() (crumbs, the data-
// gap note) are audit-framed anyway.
let CURRENT_TAB = 'audit';
// Which peer-group tier Table 2 (rank comparison) on the Comparison
// tab is currently showing - 'block'/'district'/'state', restricted
// per-view to the tiers that are actually meaningful for that scope
// (see COMPARISON_SCOPE_OPTIONS in comparisonSectionHtml).
let COMPARISON_SCOPE = 'state';

// Every fetched unit (CLF/block/district/state) has the SAME shape:
// {..., quarters, latest_quarter, quarter_months, by_period:{q:{...}}, series:{...},
//  lokos_by_period:{q:{...}}, lokos_series:{...}, compiled_by_period:{q:{...}}}.
// This pulls out the row for whichever quarter + tab is currently
// selected - same "currentPeriod()" convention as the DAK Tracker's
// own by_period model, extended with the tab dimension.
function currentPeriod(dataObj){
  const periods = (CURRENT_TAB === 'lokos' ? dataObj.lokos_by_period : dataObj.by_period) || {};
  return periods[CURRENT_QUARTER] || {};
}
// Explicit-tab version for the Comparison tab, which needs all three
// sources at once rather than whichever CURRENT_TAB happens to be.
function periodFor(dataObj, tab){
  const key = tab==='lokos' ? 'lokos_by_period' : tab==='compiled' ? 'compiled_by_period' : 'by_period';
  return (dataObj[key] || {})[CURRENT_QUARTER] || {};
}

// Coverage banner (2026-10-14): the LokOS scrape (specifically
// LoanRequests, the binding constraint on OTR/UPTO) currently only
// covers a handful of districts, so the LokOS tab's state-level
// numbers and the Comparison tab (which is restricted to just these
// districts - see build_tracker_data.py) need a visible caveat rather
// than silently looking like complete statewide figures. Reads the
// district list from manifest.json (lokos_covered_districts) instead
// of a hardcoded count/range, so this banner stays correct automatically
// as scraping coverage grows, with no HTML edit needed.
function coverageBannerHtml(){
  if(CURRENT_TAB !== 'lokos' && CURRENT_TAB !== 'comparison') return '';
  const districts = (MANIFEST && MANIFEST.lokos_covered_districts) || [];
  if(!districts.length) return '';
  const n = districts.length, first = districts[0], last = districts[districts.length-1];
  const msg = CURRENT_TAB === 'lokos'
    ? `This tab is populated with data for only ${n} districts, from ${first} to ${last}. The LokOS scrape is currently ongoing — coverage will expand as more districts are scraped.`
    : `This tab is populated with data for only ${n} districts, from ${first} to ${last} — the districts where LokOS data is available. Although Audit data exists for all districts, this tab uses Audit data only for these ${n} districts so the comparison is apples-to-apples. The LokOS scrape is currently ongoing.`;
  return `<div class="coverage-banner">${msg}</div>`;
}

function tabSwitcherHtml(){
  return `<div class="tab-switcher">
    <button class="tab-btn ${CURRENT_TAB==='audit'?'active':''}" data-tab="audit">Audit</button>
    <button class="tab-btn ${CURRENT_TAB==='lokos'?'active':''}" data-tab="lokos">LokOS</button>
    <button class="tab-btn ${CURRENT_TAB==='comparison'?'active':''}" data-tab="comparison">Comparison</button>
  </div>${coverageBannerHtml()}`;
}
function wireTabSwitcher(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.tab === CURRENT_TAB) return;
      CURRENT_TAB = btn.dataset.tab;
      refreshView();
    });

}
// Display text only - "cumulative" is the real data key everywhere else
// (by_period["cumulative"], scoring_summary.by_period["cumulative"], the
// <option value="cumulative">) - this just controls how it READS on the
// page ("Cumulative" instead of a bare lowercase key).
function periodLabel(p){ return p==='cumulative' ? 'Cumulative' : p; }

async function init(){
  STATE_DATA = await fetchJson('data/state.json');
  CURRENT_QUARTER = STATE_DATA.default_period;
  const qSel = document.getElementById('sel-quarter');
  STATE_DATA.periods.forEach(p=> qSel.insertAdjacentHTML('beforeend', `<option value="${p}"${p===CURRENT_QUARTER?' selected':''}>${periodLabel(p)}</option>`));
  qSel.addEventListener('change', e=>{ CURRENT_QUARTER = e.target.value; refreshView(); });

  MANIFEST = await fetchJson('data/manifest.json');
  const dSel = document.getElementById('sel-district');
  MANIFEST.districts.forEach(d=> dSel.insertAdjacentHTML('beforeend', `<option value="${d.slug}">${d.name}</option>`));
  dSel.addEventListener('change', onDistrictChange);
  document.getElementById('sel-block').addEventListener('change', onBlockChange);
  document.getElementById('sel-clf').addEventListener('change', onClfChange);
  document.getElementById('btn-export-excel').addEventListener('click', exportToExcel);
  await showState();
}

// Exports the full statewide dataset (all CLFs/blocks/districts/state,
// for the currently selected quarter/cumulative period) to a 4-sheet
// workbook, including every rank/percentile field already computed -
// reads the one consolidated export_data.json built for exactly this
// (see build_tracker_data.py), not the ~2,240 individual per-unit
// files the rest of the page uses.
let EXPORT_DATA = null;
async function exportToExcel(){
  const btn = document.getElementById('btn-export-excel');
  const origText = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = 'Preparing…';
  try{
    if(!EXPORT_DATA) EXPORT_DATA = await fetchJson('data/export_data.json');
    const periodData = EXPORT_DATA[CURRENT_QUARTER];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(periodData.clfs), 'CLF Level');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(periodData.blocks), 'Block Level');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(periodData.districts), 'District Level');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([periodData.state]), 'State Level');
    XLSX.writeFile(wb, `CLF_Financial_Health_${slugify(periodLabel(CURRENT_QUARTER))}.xlsx`);
  } catch(err){
    alert('Export failed: ' + err.message);
  } finally {
    btn.disabled = false; btn.innerHTML = origText;
  }
}

function refreshView(){
  if(SCOPE==='district') showDistrict();
  else if(SCOPE==='block') showBlock();
  else if(SCOPE==='clf') showClf();
  else showState();
}

function resetSelect(id, placeholder){
  const el = document.getElementById(id);
  el.innerHTML = `<option value="">${placeholder}</option>`;
  el.disabled = true;
}

async function onDistrictChange(e){
  const slug = e.target.value;
  if(!slug){ resetSelect('sel-block','— Whole district —'); resetSelect('sel-clf','— Whole block —'); await showState(); return; }
  DISTRICT_DATA = await fetchJson(`data/districts/${slug}.json`);
  const manDist = MANIFEST.districts.find(d=>d.slug===slug);
  const bSel = document.getElementById('sel-block');
  bSel.innerHTML = `<option value="">— Whole district —</option>`;
  manDist.blocks.forEach(b=> bSel.insertAdjacentHTML('beforeend', `<option value="${b.slug}">${b.name}</option>`));
  bSel.disabled = false;
  resetSelect('sel-clf','— Whole block —');
  await showDistrict();
}

async function onBlockChange(e){
  const slug = e.target.value;
  if(!slug){ resetSelect('sel-clf','— Whole block —'); await showDistrict(); return; }
  BLOCK_DATA = await fetchJson(`data/blocks/${slug}.json`);
  const dSlug = document.getElementById('sel-district').value;
  const manDist = MANIFEST.districts.find(d=>d.slug===dSlug);
  const manBlock = manDist.blocks.find(b=>b.slug===slug);
  const cSel = document.getElementById('sel-clf');
  cSel.innerHTML = `<option value="">— Whole block —</option>`;
  manBlock.clfs.forEach(c=> cSel.insertAdjacentHTML('beforeend', `<option value="${c.mis_id}">${c.clf_name} (${c.mis_id})</option>`));
  cSel.disabled = false;
  await showBlock();
}

async function onClfChange(e){
  const misId = e.target.value;
  if(!misId){ await showBlock(); return; }
  CLF_DATA = await fetchJson(`data/clfs/${misId}.json`);
  await showClf();
}

// Navigates straight to a CLF from the State view's Top/Bottom 10
// tables, which can point anywhere in the state - unlike navToClf
// (used within an already-loaded block's own CLF tables), this has to
// drive the full District -> Block -> CLF dropdown cascade itself, so
// it calls the change handlers directly (awaited) rather than firing
// a change event and hoping a single level of cascade is enough.
async function navToClfFromState(misId, districtName, blockName){
  const manDist = MANIFEST.districts.find(d=>d.name===districtName);
  if(!manDist) return;
  document.getElementById('sel-district').value = manDist.slug;
  await onDistrictChange({target:{value: manDist.slug}});
  const manBlock = manDist.blocks.find(b=>b.name===blockName);
  if(!manBlock) return;
  document.getElementById('sel-block').value = manBlock.slug;
  await onBlockChange({target:{value: manBlock.slug}});
  document.getElementById('sel-clf').value = String(misId);
  await onClfChange({target:{value: String(misId)}});
}

async function ensureScoringSummary(){
  if(!SCORING_SUMMARY) SCORING_SUMMARY = await fetchJson('data/scoring_summary.json');

}

// ============================================================================
// Gauge (semi-circle, SVG) — for percentage indicators. Zones drawn at full
// opacity across the whole arc (so every color band, including red, is
// always visible), with a single small marker dot sitting ON THE RIM of
// the arc (never at the center) showing where the current value falls.
// Deliberately simple: no needle line, no center pivot dot, no reference
// tick - those all clustered visually right on top of the number and
// looked like unexplained clutter.
// ============================================================================
function polarToCartesian(cx, cy, r, angleDeg){
  const rad = angleDeg * Math.PI/180;
  return { x: cx + r*Math.cos(rad), y: cy - r*Math.sin(rad) };
}
function describeArc(cx, cy, r, startDeg, endDeg){
  const start = polarToCartesian(cx, cy, r, startDeg);
  const end = polarToCartesian(cx, cy, r, endDeg);
  const largeArc = Math.abs(startDeg-endDeg) > 180 ? 1 : 0;
  return `M ${start.x.toFixed(1)} ${start.y.toFixed(1)} A ${r} ${r} 0 ${largeArc} 1 ${end.x.toFixed(1)} ${end.y.toFixed(1)}`;
}
function zoneColorForValue(meta, value){
  for(const z of meta.zones){ if(value <= z.to) return z.color; }
  return meta.zones[meta.zones.length-1].color;
}
function gaugeSvg(ind, value){
  const meta = IND_BY_KEY[ind];
  // h trimmed to the arc's own baseline (cy) plus a little padding - the
  // value text now sits INSIDE the arc's hollow (nestled under the dome,
  // just above the baseline) instead of below the whole gauge, so the
  // dead space that used to separate them is gone.
  const max = meta.gaugeMax, w=220, h=108, cx=w/2, cy=95, r=75;
  let zoneArcs = '', prevAngle = 180;
  meta.zones.forEach(z=>{
    const zPct = Math.max(0, Math.min(1, z.to/max));
    const angle = 180 - zPct*180;
    zoneArcs += `<path d="${describeArc(cx,cy,r,prevAngle,angle)}" stroke="${z.color}" stroke-width="16" fill="none"/>`;
    prevAngle = angle;
  });
  const clamped = value==null ? 0 : Math.max(0, Math.min(max, value));
  const valueAngle = 180 - (clamped/max)*180;
  const rim = polarToCartesian(cx, cy, r, valueAngle);
  const marker = value!=null ? `<circle cx="${rim.x.toFixed(1)}" cy="${rim.y.toFixed(1)}" r="6" fill="#fff" stroke="#1E2320" stroke-width="2.5"/>` : '';
  const valColor = value!=null ? zoneColorForValue(meta, value) : '#5B6660';
  const valText = value!=null ? value.toFixed(1)+'%' : '—';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:230px;">
    ${zoneArcs}${marker}
    <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="24" font-weight="700" fill="${valColor}">${valText}</text>
  </svg>`;
}

// ============================================================================
// Thermometer bar (for cash/bank balance) — colored by bucket status
// ============================================================================
function thermometerHtml(ind, value, bucket){
  const meta = IND_BY_KEY[ind];
  const scaleMax = Math.max(value||0, meta.threshold*2);
  const fillPct = Math.max(2, Math.min(100, (value||0)/scaleMax*100));
  const markerPct = Math.min(98, meta.threshold/scaleMax*100);
  // At block/district/state scope the box shows a TOTAL across all
  // member CLFs, but the threshold marker is still the flat per-CLF
  // baseline (it scales with n_clfs behind the scenes - see
  // build_tracker_data.py) - "per CLF" makes clear the marker isn't
  // meant to be read against the huge total directly.
  const perClf = SCOPE!=='clf' ? ' per CLF' : '';
  return `<div class="therm"><div class="fill ${bucket}" style="width:${fillPct}%;"></div><div class="marker" style="left:${markerPct}%;" title="Threshold: ${fmtRs(meta.threshold)}${perClf}"></div></div>`;
}

// ============================================================================
// Per-month strip — shown under the quarter headline figure for the 3
// monthly-native indicators (cash/bank/idle funds), so the individual
// month amounts within the selected quarter are always visible right
// alongside the quarter's derived number. Reads from the unit's own
// `series` (raw monthly dict, unaffected by the quarter toggle) sliced
// to that quarter's 3 months via `quarter_months`.
// ============================================================================
function monthStripHtml(ind, dataObj){
  // LokOS tab only (2026-10-05): cash_balance/bank_balance/idle_funds
  // are now audit-sourced (TB columns, one quarterly reading - see
  // build_tracker_data.py) on the Audit tab, so there's no month-level
  // detail to show there any more. The monthly breakdown only applies
  // to the LokOS tab's F01-sourced version of these same indicators.
  if(CURRENT_TAB !== 'lokos') return '';
  // Quarter-specific views only - the month-by-month strip doesn't map
  // cleanly onto "cumulative" (cash/bank there are just the latest
  // quarter's value, idle funds is a sum across all 3 quarters, not any
  // one 3-month window), so it's omitted entirely rather than shown in
  // some approximated form.
  if(CURRENT_QUARTER === 'cumulative') return '';
  const months = dataObj.quarter_months[CURRENT_QUARTER];
  const seriesVals = (dataObj.lokos_series || {})[ind] || {};
  return `<div class="month-strip">${months.map(m=>
    `<div class="m"><div class="mlabel">${MONTH_LABELS[m]}</div><div class="mval">${fmtRsShort(seriesVals[m])}</div></div>`
  ).join('')}</div>`;
}

// ============================================================================
// Category distribution bar (% of CLFs in green/yellow/red) — a single
// pill-shaped bar, centered, with its legend centered BELOW it (not
// beside), same convention agreed for the pie/donut option that was
// dropped for looking too similar to the gauge's arc shape. Pure CSS/
// HTML (no Plotly draw step needed, unlike the donut it replaces) - the
// % is printed directly on each segment when there's room, with the
// legend below always carrying the authoritative number + threshold
// text regardless of segment width.
// ============================================================================
function categoryBarRefinedHtml(ind, dist){
  const twoGroup = BUCKET_2GROUP.has(ind);
  const labels = twoGroup ? ['green','red'] : ['green','yellow','red'];
  const th = CATEGORY_THRESHOLD_TEXT[ind] || {};
  // Only the VISIBLE (>0%) segments, in order - needed so the rounded
  // pill ends land on the actual first/last rendered segment, not on
  // whichever color happens to be first/last in `labels` even if its
  // share is 0%.
  const visible = labels.map(l=>({l, pct: dist[l]!=null ? dist[l] : 0})).filter(s=>s.pct>0);
  const segs = visible.map((s,i)=>{
    const showLabel = s.pct>=12;
    const lname = s.l.charAt(0).toUpperCase()+s.l.slice(1);
    const tip = `${lname} (${th[s.l]||''}): ${s.pct}% of CLFs`;
    // Rounded caps on the outer edge of the first/last visible segment
    // only (not the whole bar via overflow:hidden - that was clipping
    // the hover tooltip, which needs to float OUTSIDE the bar's box).
    const isFirst = i===0, isLast = i===visible.length-1;
    const radius = `${isFirst?'16px':'0'} ${isLast?'16px':'0'} ${isLast?'16px':'0'} ${isFirst?'16px':'0'}`;
    return `<div class="seg" style="width:${s.pct}%;background:${BUCKET_COLOR[s.l]};border-radius:${radius};" data-tip="${tip}">${showLabel?s.pct+'%':''}</div>`;
  }).join('');
  const legend = labels.map(l=>`<span><span class="dot" style="background:${BUCKET_COLOR[l]}"></span>${l.charAt(0).toUpperCase()+l.slice(1)} (${th[l]||''}): <b>${dist[l]!=null?dist[l]:0}%</b></span>`).join('');
  return `<div class="refined-bar-wrap"><div class="refined-bar">${segs}</div><div class="refined-bar-legend">${legend}</div></div>`;
}

// ============================================================================
// KPI box for a single indicator (used inside each section)
// ============================================================================
function indicatorCardHtml(ind, row, dataObj){
  const meta = IND_BY_KEY[ind];
  const value = row[ind];
  if(meta.unit==='pct'){
    return `<div class="ind-card"><div class="ind-label" title="${meta.desc}">${meta.label}</div>${gaugeSvg(ind, value)}</div>`;
  }
  if(ind==='cash_balance' || ind==='bank_balance'){
    const bucket = row[ind+'_bucket'] || 'green';
    const perClf = SCOPE!=='clf' ? ' per CLF' : '';
    return `<div class="ind-card"><div class="ind-label" title="${meta.desc}">${meta.label}</div>
      <div class="kpi-box ${bucket}"><div class="big">${fmtRs(value)}</div>${thermometerHtml(ind, value, bucket)}
      <div class="caption">${ind==='bank_balance' ? (CATEGORY_THRESHOLD_TEXT.bank_balance[bucket]+perClf+' this quarter') : 'Threshold: '+fmtRs(meta.threshold)+perClf}</div>
      ${monthStripHtml(ind, dataObj)}</div></div>`;
  }
  if(ind==='idle_funds'){
    const bucket = row['idle_funds_bucket'] || 'green';
    const perClf = SCOPE!=='clf' ? ' (thresholds per CLF)' : '';
    return `<div class="ind-card"><div class="ind-label" title="${meta.desc}">${meta.label}</div>
      <div class="kpi-box ${bucket}"><div class="big">${fmtRs(value)}</div><div class="caption">Cash + bank excess over threshold, summed across the quarter${perClf}</div>
      ${monthStripHtml(ind, dataObj)}</div></div>`;
  }
  if(ind==='disb_amount'){
    return `<div class="ind-card"><div class="ind-label" title="${meta.desc}">${meta.label}</div>
      <div class="kpi-box"><div class="big">${fmtRs(value)}</div></div></div>`;
  }
  return `<div class="ind-card"><div class="ind-label">${meta.label}</div><div class="big-plain">${fmtInd(ind,value)}</div></div>`;
}

function disbPairedBarHtml(row){
  const pct = row.disb_pct, amt = row.disb_amount;
  const requested = (pct!=null && pct>0) ? amt/(pct/100) : null;
  if(requested==null) return '';
  return `<div class="paired-bar-row"><div class="plabel"><span>Requested</span><span>${fmtRs(requested)}</span></div>
      <div class="paired-bar-track"><div class="paired-bar-fill" style="width:100%;background:var(--grey);"></div></div></div>
    <div class="paired-bar-row"><div class="plabel"><span>Disbursed</span><span>${fmtRs(amt)}</span></div>
      <div class="paired-bar-track"><div class="paired-bar-fill" style="width:${Math.min(100, pct)}%;background:var(--primary);"></div></div></div>`;
}

// ============================================================================
// Indicator sections — one panel per section (no per-subsection boxes),
// sub-titles are the only demarcation. Trend charts + map live in the
// separate "Explore by Place and Period" section below, not here.
// `dataObj` is the FULL fetched unit (CLF/block/district/state) - both
// the current quarter's row (via currentPeriod) and the raw monthly
// `series` (for the month-strip) are pulled from it.
// ============================================================================
// Explains blank OTR/UPTO/disb_pct/OSS cells rather than leaving
// them unexplained - these are now scored as the worst performer
// (0) instead of being excluded from ranking, per user decision, so
// the blank display value needs a reason attached or it looks like
// an error. Two independent notes since the two groups have
// genuinely different causes (confirmed directly against raw audit
// data): otr/upto/disb_pct go blank together because the CLF
// recorded zero loan demand in every tracked quarter (or was never
// audited in this window at all); OSS goes blank because the
// audit form's OSS sub-score wasn't reliably collected before Q4
// statewide (a rollout-timing gap, unrelated to this CLF's own
// activity) - conflating the two into one message would misattribute
// the OSS gap to "no loan demand", which isn't the actual cause.
function clfDataGapNoteHtml(row){
  const notes = [];
  if(row.otr==null || row.upto==null || row.disb_pct==null){
    notes.push('This CLF did not generate any loan demand in this time period. Hence, all repayment and disbursement metrics are null.');
  }
  if(row.oss==null){
    notes.push('OSS data was not available for this CLF in this time period (the audit form\'s OSS figure wasn\'t reliably captured statewide before FY25-26 Q4).');
  }
  if(!notes.length) return '';
  return notes.map(n=>`<div class="data-gap-note">${n}</div>`).join('');
}

function indicatorSectionsHtml(dataObj, showCatBars){
  const row = currentPeriod(dataObj);
  return SECTIONS.map((sec)=>{
    const cards = sec.inds.map(ind=> indicatorCardHtml(ind, row, dataObj)).join('');
    const disbExtra = sec.title==='Loan Disbursement' ? `<div class="subsection-head">Requested vs. Disbursed</div>${disbPairedBarHtml(row)}` : '';
    const bucketInds = sec.inds.filter(i=>BUCKET_INDS.includes(i));
    const catBars = showCatBars ? `<div class="subsection-head">Share of CLFs by Category</div>
        ${bucketInds.map(i=>`<div style="margin-bottom:16px;"><div class="hint" style="margin-bottom:6px;text-align:center;">${IND_BY_KEY[i].label}</div>${categoryBarRefinedHtml(i, row[i+'_bucket_dist']||{})}</div>`).join('')}` : '';
    return `<section><div class="section-head"><h2 class="serif">${sec.title}</h2></div>
      <div class="panel">
        <div class="ind-grid">${cards}</div>
        ${disbExtra}
        ${catBars}
      </div></section>`;
  }).join('');
}

function explorePlaceTimeHtml(hasMap){

  // so it has neither a heatmap nor a meaningful trend-line comparison
  // point here (its own KPI card, under Loan Disbursement, still shows it).

  return `<section><div class="section-head"><h2 class="serif">Explore by Place and Period</h2><span class="hint">choose an indicator to update the map and the trend together &middot; the map reflects the quarter selected above; the trend always shows every period</span></div>
    <div class="panel">

      <div class="subsection-head"${hasMap?'':' style="margin-top:0;"'}>Trend Over Time</div>
      <div id="explore-chart"></div>
    </div></section>`;
}
// legendId derived as containerId+'-legend' - populated for the
// Every heatmap indicator now uses the same discrete 3-color bucket
// scheme as the section views (green/yellow/red), not a continuous
// gradient - the group's own bucket field (e.g. district-level
// otr_bucket) drives the color, same thresholds as a single CLF for
// rate indicators, n_clfs-scaled thresholds for cash/idle_funds/bank
// (see build_tracker_data.py - a group total needs a scaled threshold
// to classify the same way an average would have). disb_amount has no
// bucket scheme (it's a magnitude, not a rate) and is excluded from
// this dropdown entirely - see explorePlaceTimeHtml.
function drawChoroplethForKey(containerId, rows, geojson, key, geoIdKey, labelKey, rowIdKey, rowIdTransform){
  const legendEl = document.getElementById(containerId+'-legend');
  const locations = rows.map(r=>rowIdTransform(r[rowIdKey]));
  const bucketKey = key+'_bucket';
  const bucketZ = b => b==='red' ? 2 : b==='yellow' ? 1 : b==='green' ? 0 : null;
  const trace = {type:'choropleth', geojson, locations,
    z: rows.map(r=> bucketZ(r[bucketKey])),
    zmin:0, zmax:2, featureidkey:`properties.${geoIdKey}`,
    colorscale:[[0,BUCKET_COLOR.green],[0.5,BUCKET_COLOR.yellow],[1,BUCKET_COLOR.red]],
    marker:{line:{color:'#fff', width:0.6}}, showscale:false,
    text: rows.map(r=>`${r[labelKey]}: ${fmtInd(key, r[key])}`), hoverinfo:'text'};
  // Always-visible name labels, layered on top of the choropleth -
  // label_lon/label_lat are baked into the geojson properties (via
  // shapely's representative_point(), not centroid() - centroid can
  // land outside a concave/irregularly-shaped district or block,
  // representative_point() is guaranteed to fall inside it). A
  // separate scattergeo/text trace rather than Plotly choropleth
  // annotations, since choropleth has no built-in always-on label
  // option - hover (via the choropleth trace above) still carries the
  // actual metric value, this trace is name-only so the two never
  // show conflicting/duplicated text at once.
  const featByGeoId = {};
  (geojson.features||[]).forEach(f=> featByGeoId[f.properties[geoIdKey]] = f.properties);
  // label_size is baked in per-feature (sqrt of polygon area, scaled to a
  // 5-11px range) rather than one fixed size for every shape - Bihar's
  // districts/blocks vary up to ~28x in area, so a single size either
  // overflowed the smallest shapes or looked tiny on the largest ones.
  const labelLons = [], labelLats = [], labelTexts = [], labelSizes = [];
  locations.forEach((loc, i)=>{
    const props = featByGeoId[loc];
    if(props && props.label_lon!=null && props.label_lat!=null){
      labelLons.push(props.label_lon); labelLats.push(props.label_lat);
      labelTexts.push(rows[i][labelKey]);
      labelSizes.push(props.label_size || 8);
    }
  });
  // Dark text + a white CSS stroke halo (see the #explore-map text rule
  // in <style>), not a single fixed color with no halo - the bucket
  // fills (green/yellow/red, plus grey for "no data") are all
  // medium-toned, so no single flat text color read well against every
  // one of them. The white halo gives dark text a consistent light
  // "stage" regardless of what's underneath.
  const labelTrace = {type:'scattergeo', mode:'text', lon:labelLons, lat:labelLats, text:labelTexts,
    textfont:{size:labelSizes, color:'#2b2b2b'}, hoverinfo:'skip', showlegend:false};
  if(legendEl){
    const th = CATEGORY_THRESHOLD_TEXT[key] || {};
    const labels = ['green','yellow','red'];
    const isAmountInd = key==='cash_balance'||key==='idle_funds'||key==='bank_balance';
    legendEl.innerHTML = `<div class="refined-bar-legend">${labels.map(l=>
      `<span><span class="dot" style="background:${BUCKET_COLOR[l]}"></span>${l.charAt(0).toUpperCase()+l.slice(1)} (${th[l]||''}${isAmountInd?' per CLF':''})</span>`
    ).join('')}</div>`;
  }
  const layout = {margin:{t:0,b:0,l:0,r:0}, height:420, paper_bgcolor:'rgba(0,0,0,0)', geo:{fitbounds:'locations', visible:false}};
  Plotly.newPlot(containerId, [trace, labelTrace], layout, {displayModeBar:false, responsive:true});
}
function drawTrendChartForKey(containerId, key, seriesSource, quarters, months){
  const ind = IND_BY_KEY[key];
  const isMonthly = !!ind.monthly;
  const periods = isMonthly ? months : quarters;
  const labels = isMonthly ? months.map(m=>MONTH_LABELS_FULL[m]) : quarters;
  const series = seriesSource[key] || {};
  const values = periods.map(p=> series[p]!=null ? series[p] : null);
  const trace = {x:labels, y:values, type:'scatter', mode:'lines+markers', line:{color:'#2F9C74', width:2.5}, marker:{size:6}};
  const yaxis = {automargin:true};
  if(ind.unit==='rs'){ yaxis.tickformat = '~s'; yaxis.title = {text:'Rs', standoff:14}; }
  else { yaxis.title = {text:'%', standoff:10}; }
  const layout = {margin:{t:10,b:60,l:70,r:20}, height:280, paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)',
    yaxis, xaxis:{tickangle:-30, automargin:true}, autosize:true};
  Plotly.newPlot(containerId, [trace], layout, {displayModeBar:false, responsive:true});
}
function drawExploreSection(dataObj, mapConfig){
  const sel = document.getElementById('explore-sel');
  const geojsonPromise = mapConfig ? mapConfig.geoLoader() : null;
  function draw(key){
    drawTrendChartForKey('explore-chart', key, dataObj.series, dataObj.quarters, dataObj.months);
    if(mapConfig){
      // Every remaining key in the dropdown has a bucket scheme -
      // disb_amount (the one indicator without one) is excluded from
      // the dropdown entirely, see explorePlaceTimeHtml.
      geojsonPromise.then(geojson=> drawChoroplethForKey('explore-map', mapConfig.rows, geojson, key, mapConfig.geoIdKey, mapConfig.labelKey, mapConfig.rowIdKey, mapConfig.rowIdTransform))
        .catch(err=>{ document.getElementById('explore-map').innerHTML = `<p class="disclaimer">Map failed to load (${err.message}).</p>`; });
    }
  }
  draw(sel.value);
  sel.addEventListener('change', e=> draw(e.target.value));
}

// ============================================================================
// Sortable ranking tables
// ============================================================================
function rankingTableHtml(tableId, rows, meId, idKey, nameKey, extraCols, extraColsPosition){
  extraCols = extraCols || [];
  const indCols = [...COMPOSITE.map(k=>({key:k, label:IND_BY_KEY[k].label})), {key:'overall_score', label:'Overall'}];
  // extraColsPosition:'afterName' -> columns 3+ (e.g. District/Block on
  // the statewide Top/Bottom 10 tables); default appends after Overall
  // (e.g. District/State Rank on the within-block/district tables).
  const cols = extraColsPosition==='afterName'
    ? [{key:'__name', label:'Name'}, ...extraCols, ...indCols]
    : [{key:'__name', label:'Name'}, ...indCols, ...extraCols];
  window.__rankTables = window.__rankTables || {};
  window.__rankTables[tableId] = {rows, meId, idKey, nameKey, cols, sortKey:'overall_score', sortDir:'desc'};
  return renderRankingTableBody(tableId);
}
// Once weights have been customized (categoryWeights set - see the
// weight modal below), every ranking table's Overall column and sort
// order recompute live from that row's own {k}_state_pctl fields,
// instead of the precomputed equal-weight overall_score baked into
// the data at build time. Default (equal 50/50/...) weights produce
// the same numbers as the static overall_score, so this is safe to
// apply unconditionally once a weight session has started.
function rowWeightedScore(r){
  if(!categoryWeights) return r.overall_score;
  const pctls = {}; COMPOSITE.forEach(k=> pctls[k]=r[k+'_state_pctl']);
  return computeWeightedScore(pctls, categoryWeights);
}
function renderRankingTableBody(tableId){
  const st = window.__rankTables[tableId];
  const sorted = [...st.rows].sort((a,b)=>{
    const av = st.sortKey==='__name' ? a[st.nameKey] : st.sortKey==='overall_score' ? rowWeightedScore(a) : a[st.sortKey];
    const bv = st.sortKey==='__name' ? b[st.nameKey] : st.sortKey==='overall_score' ? rowWeightedScore(b) : b[st.sortKey];
    if(av==null) return 1; if(bv==null) return -1;
    if(typeof av==='string') return st.sortDir==='asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return st.sortDir==='asc' ? av-bv : bv-av;
  });
  const overallLabel = categoryWeights ? 'Overall (weighted)' : 'Overall';
  const head = `<tr><th>Rank</th>${st.cols.map(c=>`<th data-key="${c.key}">${c.key==='overall_score'?overallLabel:c.label}${st.sortKey===c.key?`<span class="arrow">${st.sortDir==='asc'?'▲':'▼'}</span>`:''}</th>`).join('')}</tr>`;
  const body = sorted.map((r,i)=>{
    const isMe = st.meId!=null && r[st.idKey]===st.meId;
    const cells = st.cols.map(c=>{
      if(c.key==='__name') return `<td>${r[st.nameKey]}</td>`;
      if(c.key==='overall_score'){ const ov = rowWeightedScore(r); return `<td><b>${ov!=null?ov.toFixed(1):'—'}</b></td>`; }
      if(COMPOSITE.includes(c.key)) return `<td class="${grade(r[c.key+'_state_pctl'])}">${fmtInd(c.key, r[c.key])}</td>`;
      return `<td>${r[c.key]!=null?r[c.key]:'—'}</td>`;
    }).join('');
    return `<tr class="${isMe?'me':''}" data-id="${r[st.idKey]}"><td class="rank-cell">${i+1}</td>${cells}</tr>`;
  }).join('');
  return `<div class="table-wrap"><table id="${tableId}"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
function wireSortableTable(tableId, containerSelector, onRowClick){
  const st = window.__rankTables[tableId];
  st.containerSelector = containerSelector;
  st.onRowClick = onRowClick;
  const container = document.querySelector(containerSelector);
  container.querySelectorAll('thead th[data-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      st.sortDir = (st.sortKey===key && st.sortDir==='desc') ? 'asc' : 'desc';
      st.sortKey = key;
      container.innerHTML = renderRankingTableBody(tableId);
      wireSortableTable(tableId, containerSelector, onRowClick);
    });
  });
  container.querySelectorAll('tbody tr').forEach(tr=>{
    tr.addEventListener('click', ()=> onRowClick(tr.dataset.id));
  });
}
// Called whenever categoryWeights changes (slider drag, reset) so
// every ranking table currently on the page - not just the weight
// modal's own single-unit panel - reflects the new weights immediately.
function refreshAllRankingTables(){
  Object.keys(window.__rankTables||{}).forEach(tableId=>{
    const st = window.__rankTables[tableId];
    if(!st.containerSelector) return;
    const container = document.querySelector(st.containerSelector);
    if(!container) return;
    container.innerHTML = renderRankingTableBody(tableId);
    wireSortableTable(tableId, st.containerSelector, st.onRowClick);
  });
}

// The State view's Top/Bottom 10 tables start out holding the fixed
// 10+10 CLFs computed at build time under equal weights. Re-scoring
// those same 20 rows (via refreshAllRankingTables above) isn't enough
// once weights are customized - a CLF buried around rank #800 under
// equal weights could legitimately BECOME the actual #1 CLF under an
// extreme single-indicator weighting, so who belongs in the top/bottom
// 10 has to be recomputed against the full statewide CLF pool, not
// just re-sorted within the original 20. scoring_summary.json (a
// fraction of export_data.json's size - percentiles only, no raw
// values) has every CLF's pctl for exactly this; the ~20 CLFs that
// come out on top/bottom are then fetched individually (small, fast)
// for their full display data (name, raw values). Debounced so
// dragging a slider doesn't fire this on every pixel of movement.
let topBottomRecomputeTimer = null;
function scheduleTopBottomRecompute(){
  if(SCOPE!=='state') return;
  clearTimeout(topBottomRecomputeTimer);
  topBottomRecomputeTimer = setTimeout(recomputeStatewideTopBottom, 400);
}
async function recomputeStatewideTopBottom(){
  if(SCOPE!=='state' || !categoryWeights) return;
  const weights = {...categoryWeights};
  const summary = await ensureScoringSummary();
  const qSummary = summary.by_period[CURRENT_QUARTER];
  const scored = qSummary.clfs.map(r=>({id:r.id, score: computeWeightedScore(r.pctl, weights)})).filter(r=>r.score!=null);
  if(SCOPE!=='state' || JSON.stringify(weights)!==JSON.stringify(categoryWeights)) return; // stale response guard
  const topIds = [...scored].sort((a,b)=>b.score-a.score).slice(0,10).map(r=>r.id);
  const bottomIds = [...scored].sort((a,b)=>a.score-b.score).slice(0,10).map(r=>r.id);
  const allIds = [...new Set([...topIds, ...bottomIds])];
  const rowsById = {};
  await Promise.all(allIds.map(async id=>{
    const d = await fetchJson(`data/clfs/${id}.json`);
    rowsById[id] = currentPeriod(d);
  }));
  if(SCOPE!=='state' || JSON.stringify(weights)!==JSON.stringify(categoryWeights)) return;
  if(window.__rankTables['top10-clf']) window.__rankTables['top10-clf'].rows = topIds.map(id=>rowsById[id]);
  if(window.__rankTables['bottom10-clf']) window.__rankTables['bottom10-clf'].rows = bottomIds.map(id=>rowsById[id]);
  refreshAllRankingTables();
}

// ============================================================================
// Weight modal — recomputes against the CURRENTLY SELECTED quarter's
// percentiles (both the unit's own pctls and the statewide pool it's
// ranked against), so the weighted score/rank stays internally
// consistent with whatever quarter the rest of the page is showing.
// ============================================================================
let categoryWeights = null;
function weightModalHtml(){
  const stateHint = 'Drag each slider to change how much that indicator counts toward every ranking table\'s Overall column, statewide, for ' + periodLabel(CURRENT_QUARTER) + '. Weights are relative, not fixed percentages. Loan Disbursement Amount isn\'t included (it\'s a magnitude, not a rate).';
  const unitHint = `Drag each slider to change how much that indicator counts toward the Overall Score for ${periodLabel(CURRENT_QUARTER)}. Weights are relative, not fixed percentages. Loan Disbursement Amount isn't included (it's a magnitude, not a rate). Every ranking table on the page updates too.`;
  return `<div class="weight-modal-backdrop" id="weight-modal-backdrop"><div class="weight-modal">
    <div class="weight-modal-head"><h3>Choose Indicator Weights</h3><button class="weight-modal-close" id="btn-close-weights">&times;</button></div>
    <p class="weight-modal-hint">${SCOPE==='state' ? stateHint : unitHint}</p>
    <div id="weight-rows"></div>
    ${SCOPE==='state' ? '' : '<div class="weight-result" id="weight-result"></div>'}
    <div class="weight-modal-actions">
      <button class="weight-reset-btn" id="btn-reset-weights">Reset to Equal Weights</button>
      <button class="weight-done-btn" id="btn-done-weights">Done</button>
    </div></div></div>`;
}
function computeWeightedScore(pctlObj, weights){
  let num=0, den=0;
  COMPOSITE.forEach(k=>{ if(pctlObj[k]!=null){ num += weights[k]*pctlObj[k]; den += weights[k]; } });
  return den>0 ? num/den : null;
}
function currentUnitPctls(){
  const dataObj = SCOPE==='clf' ? CLF_DATA : SCOPE==='block' ? BLOCK_DATA : SCOPE==='district' ? DISTRICT_DATA : null;
  if(!dataObj) return null;
  const row = currentPeriod(dataObj);
  const out = {}; COMPOSITE.forEach(k=> out[k] = row[k+'_state_pctl']);
  return out;
}
function renderWeightRows(){
  const total = COMPOSITE.reduce((a,k)=>a+categoryWeights[k],0) || 1;
  document.getElementById('weight-rows').innerHTML = COMPOSITE.map(k=>{
    const pct = Math.round(categoryWeights[k]/total*100);
    return `<div class="weight-row"><div class="weight-row-head"><span class="wname">${IND_BY_KEY[k].label}</span><span class="wpct">${pct}%</span></div>
      <input type="range" min="0" max="100" value="${categoryWeights[k]}" class="weight-slider" data-k="${k}"></div>`;
  }).join('');
  document.querySelectorAll('.weight-slider').forEach(el=>{
    el.addEventListener('input', e=>{ categoryWeights[e.target.dataset.k]=+e.target.value; renderWeightRows(); renderWeightResult(); refreshAllRankingTables(); scheduleTopBottomRecompute(); });
  });
}
let weightReqId=0;
async function renderWeightResult(){
  const myReq = ++weightReqId;
  const box = document.getElementById('weight-result');
  if(!box) return; // state scope has no weight-result panel at all - see weightModalHtml
  const pctls = currentUnitPctls();
  if(!pctls){ box.innerHTML = `<p class="disclaimer">Select a District, Block, or CLF to see a recomputed score.</p>`; return; }
  const myScore = computeWeightedScore(pctls, categoryWeights);
  box.innerHTML = `<div class="weight-result-row"><span class="wlabel">Recomputed Overall Score</span><span class="wval">${myScore!=null?myScore.toFixed(1):'—'} / 100</span></div>
    <div class="weight-result-row"><span class="wlabel">Statewide Rank</span><span class="wval" style="color:var(--gold)">Loading&hellip;</span></div>`;
  const summary = await ensureScoringSummary();
  const qSummary = summary.by_period[CURRENT_QUARTER];
  const pool = SCOPE==='clf' ? qSummary.clfs : SCOPE==='block' ? qSummary.blocks : qSummary.districts;
  const idKeyLocal = SCOPE==='clf' ? 'id' : 'name';
  const myId = SCOPE==='clf' ? CLF_DATA.mis_id : SCOPE==='block' ? BLOCK_DATA.name : DISTRICT_DATA.name;
  const scored = pool.map(r=>({ id:r[idKeyLocal], score: computeWeightedScore(r.pctl, categoryWeights) })).filter(r=>r.score!=null);
  scored.sort((a,b)=>b.score-a.score);
  const stateRank = scored.findIndex(r=> r.id===myId) + 1;
  if(myReq!==weightReqId) return;
  box.innerHTML = `<div class="weight-result-row"><span class="wlabel">Recomputed Overall Score</span><span class="wval">${myScore!=null?myScore.toFixed(1):'—'} / 100</span></div>
    <div class="weight-result-row"><span class="wlabel">Statewide Rank</span><span class="wval" style="color:var(--gold)">${stateRank>0?stateRank+ord(stateRank)+' of '+scored.length:'—'}</span></div>`;
}
function openWeightModal(){
  if(!categoryWeights){ categoryWeights={}; COMPOSITE.forEach(k=>categoryWeights[k]=50); }
  const existing = document.getElementById('weight-modal-backdrop');
  if(existing) existing.remove();
  document.body.insertAdjacentHTML('beforeend', weightModalHtml());
  document.getElementById('btn-close-weights').addEventListener('click', closeWeightModal);
  document.getElementById('btn-done-weights').addEventListener('click', closeWeightModal);
  document.getElementById('btn-reset-weights').addEventListener('click', ()=>{ COMPOSITE.forEach(k=>categoryWeights[k]=50); renderWeightRows(); renderWeightResult(); refreshAllRankingTables(); scheduleTopBottomRecompute(); });
  document.getElementById('weight-modal-backdrop').addEventListener('click', e=>{ if(e.target.id==='weight-modal-backdrop') closeWeightModal(); });
  renderWeightRows(); renderWeightResult();
  document.getElementById('weight-modal-backdrop').classList.add('open');
}
function closeWeightModal(){ const el=document.getElementById('weight-modal-backdrop'); if(el) el.classList.remove('open'); }

// ============================================================================
// Comparison tab (2026-10-05): Audit/LokOS tabs show only metric
// values; this tab holds the cross-source comparison + all
// scoring/ranking, consolidated in one place rather than duplicated on
// every tab. Two tables - value comparison (every indicator) and rank
// comparison (every indicator + Overall, across whichever peer-group
// tiers are meaningful at this SCOPE).
// ============================================================================
// disb_pct excluded (2026-10-14): LokOS has no independent
// reconstruction for it (tried dividing LokOS disb_amount by the
// audit's own loan_demand_amount, but the result was implausible for
// nearly every CLF - see build_tracker_data.py), so it's always null
// on the LokOS side. A comparison row with only one real column isn't
// a comparison, so it's dropped from this tab entirely rather than
// shown with a blank LokOS column - it still appears normally on the
// Audit tab, where its value is real.
const COMPARISON_INDS = Object.keys(IND_BY_KEY).filter(k => k !== 'disb_pct');
// Disb %/Amount USED to be mirrored onto both tabs from the same
// underlying field (clf_full_lokos copied clf_full's disb_pct/
// disb_amount directly, never recomputed them) - true from 2026-10-12
// through 2026-10-13. As of 2026-10-14, LokOS disb_amount is
// independently reconstructed from LoanRequests' own loanAmount field,
// and LokOS disb_pct divides that independent amount by the audit's
// own loan_demand_amount (shared denominator, since LoanRequests has
// no demand figure of its own - see build_tracker_data.py). Both are
// now genuinely comparable, not a guaranteed-zero delta, so this set
// is empty rather than removed outright - kept in case a future
// indicator ever needs the same "nothing to compare" treatment.
const SAME_SOURCE_INDS = new Set([]);

function agreementFlag(a, b){
  if(a==null || b==null) return null;
  const denom = Math.max(Math.abs(a), Math.abs(b), 1);
  const diffPct = Math.abs(a-b) / denom * 100;
  if(diffPct <= 10) return 'close';
  if(diffPct <= 50) return 'moderate';
  return 'large';
}
const AGREEMENT_LABEL = {close:'Close', moderate:'Moderate gap', large:'Large gap'};

function comparisonValueTableHtml(auditRow, lokosRow){
  const rows = COMPARISON_INDS.map(ind=>{
    const meta = IND_BY_KEY[ind];
    const av = auditRow[ind], lv = lokosRow[ind];
    const aBucket = auditRow[ind+'_bucket'] || '', lBucket = lokosRow[ind+'_bucket'] || '';
    const sameSource = SAME_SOURCE_INDS.has(ind);
    let deltaCell = '<span class="hint">—</span>', flagCell = '<span class="hint">—</span>';
    if(sameSource){
      deltaCell = '<span class="hint">same source</span>';
      flagCell = '<span class="hint">n/a</span>';
    } else if(av!=null && lv!=null){
      const delta = lv - av;
      deltaCell = (delta>=0?'+':'−') + fmtInd(ind, Math.abs(delta));
      const flag = agreementFlag(av, lv);
      flagCell = `<span class="agree-flag agree-${flag}">${AGREEMENT_LABEL[flag]}</span>`;
    }
    return `<tr>
      <td>${meta.label}</td>
      <td class="cmp-val ${aBucket}">${fmtInd(ind, av)}</td>
      <td class="cmp-val ${lBucket}">${fmtInd(ind, lv)}</td>
      <td>${deltaCell}</td>
      <td>${flagCell}</td>
    </tr>`;
  }).join('');
  return `<table class="comparison-table">
    <thead><tr><th>Indicator</th><th>Audit</th><th>LokOS</th><th>Delta</th><th>Agreement</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function comparisonRankTableHtml(auditRow, lokosRow, compiledRow, scope){
  // disb_pct excluded here too - see COMPARISON_INDS above for why.
  const inds = COMPOSITE.filter(k => k !== 'disb_pct').concat(['overall']);
  const rankCell = (row, ind) => {
    const rank = row ? row[`${ind}_${scope}_rank`] : null;
    const n = row ? row[`${ind}_${scope}_n`] : null;
    return rank!=null ? `${rank}${ord(rank)} <span class="hint">of ${n}</span>` : '—';
  };
  const rows = inds.map(ind=>{
    const label = ind==='overall' ? 'Overall' : IND_BY_KEY[ind].label;
    return `<tr${ind==='overall'?' class="cmp-overall-row"':''}>
      <td>${label}</td>
      <td>${rankCell(auditRow, ind)}</td>
      <td>${rankCell(lokosRow, ind)}</td>
      <td>${rankCell(compiledRow, ind)}</td>
    </tr>`;
  }).join('');
  return `<table class="comparison-table">
    <thead><tr><th>Indicator</th><th>Audit Rank</th><th>LokOS Rank</th><th>Compiled Rank</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function comparisonScopeToggleHtml(options){
  return `<div class="tab-switcher" style="margin-top:0;">` + options.map(o=>
    `<button class="tab-btn cmp-scope-btn ${COMPARISON_SCOPE===o.key?'active':''}" data-scope="${o.key}">${o.label}</button>`
  ).join('') + `</div>`;
}
function wireComparisonScopeToggle(){
  document.querySelectorAll('.cmp-scope-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.scope === COMPARISON_SCOPE) return;
      COMPARISON_SCOPE = btn.dataset.scope;
      refreshView();
    });
  });
}

// level = 'clf'|'block'|'district'|'state' - controls which peer-group
// tiers Table 2 offers, since e.g. a district has no "within block"
// concept and a state has no peers to rank against at all (Table 2 is
// omitted entirely there, Table 1 still applies to the state's own
// aggregate values).
const COMPARISON_SCOPE_OPTIONS_BY_LEVEL = {
  clf: [{key:'block', label:'Within Block'}, {key:'district', label:'Within District'}, {key:'state', label:'Statewide'}],
  block: [{key:'district', label:'Within District'}, {key:'state', label:'Statewide'}],
  district: [{key:'state', label:'Statewide'}],
  state: [],
};
function comparisonSectionHtml(dataObj, level){
  // At state scope specifically, the Audit tab's own value (periodFor
  // 'audit') is a genuine statewide-38-district average - correct for
  // the Audit tab, but shown next to LokOS's value (restricted to the
  // LokOS-covered districts) it's an apples-to-oranges comparison
  // (2026-10-14 correction). state.json carries a separate
  // comparison_audit_by_period computed over the SAME restricted
  // population as LokOS, for this table only - district/block/CLF
  // scope don't need this, since Table 1 there is already a single
  // unit's own value, not a population aggregate.
  const auditRow = (level === 'state' && dataObj.comparison_audit_by_period)
    ? (dataObj.comparison_audit_by_period[CURRENT_QUARTER] || {})
    : periodFor(dataObj, 'audit');
  const lokosRow = periodFor(dataObj, 'lokos');
  const compiledRow = periodFor(dataObj, 'compiled');

  const scopeOptions = COMPARISON_SCOPE_OPTIONS_BY_LEVEL[level] || [];
  if(scopeOptions.length && !scopeOptions.find(o=>o.key===COMPARISON_SCOPE)){
    COMPARISON_SCOPE = scopeOptions[0].key;
  }

  const table2Html = scopeOptions.length ? `
    <section><div class="section-head"><h2 class="serif">Rank Comparison</h2><span class="hint">${periodLabel(CURRENT_QUARTER)}</span></div>
      <div class="panel">
        ${comparisonScopeToggleHtml(scopeOptions)}
        <div style="margin-top:16px;overflow-x:auto;">${comparisonRankTableHtml(auditRow, lokosRow, compiledRow, COMPARISON_SCOPE)}</div>
      </div></section>` : `
    <section><div class="section-head"><h2 class="serif">Rank Comparison</h2></div>
      <div class="panel"><p class="hint" style="margin:0;">A single state has no peer group to rank against - rank comparison applies at district, block, and CLF scope.</p></div></section>`;

  return `
    <section><div class="section-head"><h2 class="serif">Value Comparison</h2><span class="hint">${periodLabel(CURRENT_QUARTER)} &middot; audit vs LokOS, colored by the usual thresholds</span></div>
      <div class="panel" style="overflow-x:auto;">${comparisonValueTableHtml(auditRow, lokosRow)}</div></section>
    ${table2Html}`;
}

// ---------------------------------------------------------------- STATE view
async function showState(){
  SCOPE='state'; DISTRICT_DATA=null; BLOCK_DATA=null; CLF_DATA=null;
  setCrumbs();
  const row = currentPeriod(STATE_DATA);
  const districts = row.districts || [];
  const isComparison = CURRENT_TAB === 'comparison';
  document.getElementById('app').innerHTML = `
    ${tabSwitcherHtml()}
    ${isComparison ? comparisonSectionHtml(STATE_DATA, 'state') : `
      ${indicatorSectionsHtml(STATE_DATA, true)}
      ${explorePlaceTimeHtml(true)}`}`;
  wireTabSwitcher();
  if(isComparison){
    wireComparisonScopeToggle();
  } else {
    drawExploreSection(STATE_DATA, {rows:districts, geoLoader:loadGeoDistricts, geoIdKey:'district_name', labelKey:'name', rowIdKey:'district_geo_id', rowIdTransform:v=>v});
  }
}

  // clfDataGapNoteHtml stays audit-only - its specific wording ("audit

  // compiled rank might be missing.
  document.getElementById('app').innerHTML = `
    ${tabSwitcherHtml()}
    <section><div class="section-head"><h2 class="serif">${CLF_DATA.clf_name}</h2><span class="hint">MIS ID ${CLF_DATA.mis_id} &middot; ${CLF_DATA.block}, ${CLF_DATA.district}</span></div>${CURRENT_TAB==='audit' ? clfDataGapNoteHtml(row) : ''}</section>
    ${isComparison ? comparisonSectionHtml(CLF_DATA, 'clf') : `

  }

init();
